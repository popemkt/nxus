&quot; parent=\&quot;0\&quot;/&gt;&amp;#xa;        &lt;mxCell id=\&quot;2\&quot; value=\&quot;&amp;lt;b&amp;gt;Key component explanations v7&amp;lt;/b&amp;gt;\&quot; style=\&quot;text;html=1;strokeColor=none;fillColor=none;align=center;verticalAlign=middle;fontStyle=1;fontSize=24;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&amp;#xa;          &lt;mxGeometry x=\&quot;1300\&quot; y=\&quot;24\&quot; width=\&quot;1050\&quot; height=\&quot;36\&quot; as=\&quot;geometry\&quot;/&gt;&amp;#xa;        &lt;/mxCell&gt;&amp;#xa;        &lt;mxCell id=\&quot;3\&quot; value=\&quot;Explanations of the model components that shape how the factory works.\&quot; style=\&quot;text;html=1;strokeColor=none;fillColor=none;align=left;verticalAlign=middle;fontSize=12;fontColor=#555555;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&amp;#xa;          &lt;mxGeometry x=\&quot;360\&quot; y=\&quot;66\&quot; width=\&quot;3300\&quot; height=\&quot;24\&quot; as=\&quot;geometry\&quot;/&gt;&amp;#xa;        &lt;/mxCell&gt;&amp;#xa;        &lt;mxCell id=\&quot;4\&quot; value=\&quot;&amp;lt;b&amp;gt;External object inventory&amp;lt;/b&amp;gt;&amp;lt;br/&amp;gt;&amp;lt;span style=&amp;quot;color:#555555&amp;quot;&amp;gt;Concept explanation&amp;lt;/span&amp;gt;&amp;lt;hr size=&amp;quot;1&amp;quot;/&amp;gt;&amp;lt;b&amp;gt;What it is&amp;lt;/b&amp;gt;&amp;lt;br/&amp;gt;The vocabulary that product, business and stakeholders can discuss.&amp;lt;br/&amp;gt;&amp;lt;br/&amp;gt;&amp;lt;b&amp;gt;Why it matters&amp;lt;/b&amp;gt;&amp;lt;br/&amp;gt;It prevents the model from collapsing into generic artifacts like “Blueprint” or “Analysis”.&amp;lt;br/&amp;gt;&amp;lt;br/&amp;gt;&amp;lt;b&amp;gt;Example&amp;lt;/b&amp;gt;&amp;lt;br/&amp;gt;In Blueprint, ProductOutcome, Scope, SuccessCriteria, Dependency and Assumption are different concepts, not just fields.\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#ffffff;strokeColor=#999999;fontSize=12;align=left;verticalAlign=top;spacingTop=12;spacingLeft=14;spacingRight=14;spacingBottom=12;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&amp;#xa;          &lt;mxGeometry x=\&quot;180\&quot; y=\&quot;140\&quot; width=\&quot;1800\&quot; height=\&quot;420\&quot; as=\&quot;geometry\&quot;/&gt;&amp;#xa;        &lt;/mxCell&gt;&amp;#xa;        &lt;mxCell id=\&quot;5\&quot; value=\&quot;&amp;lt;b&amp;gt;Internal object inventory&amp;lt;/b&amp;gt;&amp;lt;br/&amp;gt;&amp;lt;span style=&amp;quot;color:#555555&amp;quot;&amp;gt;Concept explanation&amp;lt;/span&amp;gt;&amp;lt;hr size=&amp;quot;1&amp;quot;/&amp;gt;&amp;lt;b&amp;gt;What it is&amp;lt;/b&amp;gt;&amp;lt;br/&amp;gt;The factory objects needed to execute, audit, automate and govern each swimlane.&amp;lt;br/&amp;gt;&amp;lt;br/&amp;gt;&amp;lt;b&amp;gt;Why it matters&amp;lt;/b&amp;gt;&amp;lt;br/&amp;gt;It shows how the factory works internally: tasks, scores, documents, gates, reviews, evidence, logs and rollback records.&amp;lt;br/&amp;gt;&amp;lt;br/&amp;gt;&amp;lt;b&amp;gt;Example&amp;lt;/b&amp;gt;&amp;lt;br/&amp;gt;Testing has TestPlan, TestCase, TestRun, QualityGate, HumanTestReview and TestEvidence.\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#ffffff;strokeColor=#999999;fontSize=12;align=left;verticalAlign=top;spacingTop=12;spacingLeft=14;spacingRight=14;spacingBottom=12;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&amp;#xa;          &lt;mxGeometry x=\&quot;2130\&quot; y=\&quot;140\&quot; width=\&quot;1800\&quot; height=\&quot;420\&quot; as=\&quot;geometry\&quot;/&gt;&amp;#xa;        &lt;/mxCell&gt;&amp;#xa;        &lt;mxCell id=\&quot;6\&quot; value=\&quot;&amp;lt;b&amp;gt;DraiverFunction&amp;lt;/b&amp;gt;&amp;lt;br/&amp;gt;&amp;lt;span style=&amp;quot;color:#555555&amp;quot;&amp;gt;Concept explanation&amp;lt;/span&amp;gt;&amp;lt;hr size=&amp;quot;1&amp;quot;/&amp;gt;&amp;lt;b&amp;gt;What it is&amp;lt;/b&amp;gt;&amp;lt;br/&amp;gt;A configured capability mapped to a swimlane.&amp;lt;br/&amp;gt;&amp;lt;br/&amp;gt;&amp;lt;b&amp;gt;Why it matters&amp;lt;/b&amp;gt;&amp;lt;br/&amp;gt;It explains what Draiver can do in a phase without pretending the function is the whole phase.&amp;lt;br/&amp;gt;&amp;lt;br/&amp;gt;&amp;lt;b&amp;gt;Important&amp;lt;/b&amp;gt;&amp;lt;br/&amp;gt;One swimlane can have zero, one or many DraiverFunctions.\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#ffffff;strokeColor=#999999;fontSize=12;align=left;verticalAlign=top;spacingTop=12;spacingLeft=14;spacingRight=14;spacingBottom=12;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&amp;#xa;          &lt;mxGeometry x=\&quot;180\&quot; y=\&quot;670\&quot; width=\&quot;1800\&quot; height=\&quot;420\&quot; as=\&quot;geometry\&quot;/&gt;&amp;#xa;        &lt;/mxCell&gt;&amp;#xa;        &lt;mxCell id=\&quot;7\&quot; value=\&quot;&amp;lt;b&amp;gt;DraiverFunctionRun&amp;lt;/b&amp;gt;&amp;lt;br/&amp;gt;&amp;lt;span style=&amp;quot;color:#555555&amp;quot;&amp;gt;Concept explanation&amp;lt;/span&amp;gt;&amp;lt;hr size=&amp;quot;1&amp;quot;/&amp;gt;&amp;lt;b&amp;gt;What it is&amp;lt;/b&amp;gt;&amp;lt;br/&amp;gt;A runtime record showing that a DraiverFunction actually executed.&amp;lt;br/&amp;gt;&amp;lt;br/&amp;gt;&amp;lt;b&amp;gt;Why it matters&amp;lt;/b&amp;gt;&amp;lt;br/&amp;gt;It separates capability configuration from execution history.&amp;lt;br/&amp;gt;&amp;lt;br/&amp;gt;&amp;lt;b&amp;gt;Example&amp;lt;/b&amp;gt;&amp;lt;br/&amp;gt;BlueprintPlanner is the function; a specific generation of plans.md is a function run.\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#ffffff;strokeColor=#999999;fontSize=12;align=left;verticalAlign=top;spacingTop=12;spacingLeft=14;spacingRight=14;spacingBottom=12;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&amp;#xa;          &lt;mxGeometry x=\&quot;2130\&quot; y=\&quot;670\&quot; width=\&quot;1800\&quot; height=\&quot;420\&quot; as=\&quot;geometry\&quot;/&gt;&amp;#xa;        &lt;/mxCell&gt;&amp;#xa;        &lt;mxCell id=\&quot;8\&quot; value=\&quot;&amp;lt;b&amp;gt;PhaseExecution&amp;lt;/b&amp;gt;&amp;lt;br/&amp;gt;&amp;lt;span style=&amp;quot;color:#555555&amp;quot;&amp;gt;Concept explanation&amp;lt;/span&amp;gt;&amp;lt;hr size=&amp;quot;1&amp;quot;/&amp;gt;&amp;lt;b&amp;gt;What it is&amp;lt;/b&amp;gt;&amp;lt;br/&amp;gt;The auditable runtime record for one swimlane during one LifecycleRun.&amp;lt;br/&amp;gt;&amp;lt;br/&amp;gt;&amp;lt;b&amp;gt;Why it matters&amp;lt;/b&amp;gt;&amp;lt;br/&amp;gt;It captures status, time, inputs, outputs, decisions, control points and feedback.&amp;lt;br/&amp;gt;&amp;lt;br/&amp;gt;&amp;lt;b&amp;gt;Important&amp;lt;/b&amp;gt;&amp;lt;br/&amp;gt;The swimlane is the stage; PhaseExecution is the record of passing through the stage.\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#ffffff;strokeColor=#999999;fontSize=12;align=left;verticalAlign=top;spacingTop=12;spacingLeft=14;spacingRight=14;spacingBottom=12;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&amp;#xa;          &lt;mxGeometry x=\&quot;180\&quot; y=\&quot;1200\&quot; width=\&quot;1800\&quot; height=\&quot;420\&quot; as=\&quot;geometry\&quot;/&gt;&amp;#xa;        &lt;/mxCell&gt;&amp;#xa;        &lt;mxCell id=\&quot;9\&quot; value=\&quot;&amp;lt;b&amp;gt;HandoffGate&amp;lt;/b&amp;gt;&amp;lt;br/&amp;gt;&amp;lt;span style=&amp;quot;color:#555555&amp;quot;&amp;gt;Concept explanation&amp;lt;/span&amp;gt;&amp;lt;hr size=&amp;quot;1&amp;quot;/&amp;gt;&amp;lt;b&amp;gt;What it is&amp;lt;/b&amp;gt;&amp;lt;br/&amp;gt;A structured transition checkpoint between swimlanes.&amp;lt;br/&amp;gt;&amp;lt;br/&amp;gt;&amp;lt;b&amp;gt;Why it matters&amp;lt;/b&amp;gt;&amp;lt;br/&amp;gt;It makes transitions explicit and readable: required output, entry/exit criteria and decision result.&amp;lt;br/&amp;gt;&amp;lt;br/&amp;gt;&amp;lt;b&amp;gt;Example&amp;lt;/b&amp;gt;&amp;lt;br/&amp;gt;G2 Blueprint approved produces BlueprintDocument / plans.md and enables DevelopmentTask.\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#ffffff;strokeColor=#999999;fontSize=12;align=left;verticalAlign=top;spacingTop=12;spacingLeft=14;spacingRight=14;spacingBottom=12;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&amp;#xa;          &lt;mxGeometry x=\&quot;2130\&quot; y=\&quot;1200\&quot; width=\&quot;1800\&quot; height=\&quot;420\&quot; as=\&quot;geometry\&quot;/&gt;&amp;#xa;        &lt;/mxCell&gt;&amp;#xa;        &lt;mxCell id=\&quot;10\&quot; value=\&quot;&amp;lt;b&amp;gt;TraceabilityLink&amp;lt;/b&amp;gt;&amp;lt;br/&amp;gt;&amp;lt;span style=&amp;quot;color:#555555&amp;quot;&amp;gt;Concept explanation&amp;lt;/span&amp;gt;&amp;lt;hr size=&amp;quot;1&amp;quot;/&amp;gt;&amp;lt;b&amp;gt;What it is&amp;lt;/b&amp;gt;&amp;lt;br/&amp;gt;A reusable relationship record between objects that must be traceable.&amp;lt;br/&amp;gt;&amp;lt;br/&amp;gt;&amp;lt;b&amp;gt;Why it matters&amp;lt;/b&amp;gt;&amp;lt;br/&amp;gt;It avoids spaghetti lines in the UML while preserving requirement-to-test-to-evidence relationships.&amp;lt;br/&amp;gt;&amp;lt;br/&amp;gt;&amp;lt;b&amp;gt;Example&amp;lt;/b&amp;gt;&amp;lt;br/&amp;gt;Requirement → TestCase → TestEvidence → QualityGate.\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#ffffff;strokeColor=#999999;fontSize=12;align=left;verticalAlign=top;spacingTop=12;spacingLeft=14;spacingRight=14;spacingBottom=12;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&amp;#xa;          &lt;mxGeometry x=\&quot;180\&quot; y=\&quot;1730\&quot; width=\&quot;1800\&quot; height=\&quot;420\&quot; as=\&quot;geometry\&quot;/&gt;&amp;#xa;        &lt;/mxCell&gt;&amp;#xa;        &lt;mxCell id=\&quot;11\&quot; value=\&quot;&amp;lt;b&amp;gt;FeedbackLoop&amp;lt;/b&amp;gt;&amp;lt;br/&amp;gt;&amp;lt;span style=&amp;quot;color:#555555&amp;quot;&amp;gt;Concept explanation&amp;lt;/span&amp;gt;&amp;lt;hr size=&amp;quot;1&amp;quot;/&amp;gt;&amp;lt;b&amp;gt;What it is&amp;lt;/b&amp;gt;&amp;lt;br/&amp;gt;A recorded return path from one phase back to another.&amp;lt;br/&amp;gt;&amp;lt;br/&amp;gt;&amp;lt;b&amp;gt;Why it matters&amp;lt;/b&amp;gt;&amp;lt;br/&amp;gt;It makes rework explicit rather than treating it as an invisible exception.&amp;lt;br/&amp;gt;&amp;lt;br/&amp;gt;&amp;lt;b&amp;gt;Example&amp;lt;/b&amp;gt;&amp;lt;br/&amp;gt;Testing can return to Development; Deployment can return to Release or Blueprint if assumptions fail.\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#ffffff;strokeColor=#999999;fontSize=12;align=left;verticalAlign=top;spacingTop=12;spacingLeft=14;spacingRight=14;spacingBottom=12;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&amp;#xa;          &lt;mxGeometry x=\&quot;2130\&quot; y=\&quot;1730\&quot; width=\&quot;1800\&quot; height=\&quot;420\&quot; as=\&quot;geometry\&quot;/&gt;&amp;#xa;        &lt;/mxCell&gt;&amp;#xa;      &lt;/root&gt;&amp;#xa;    &lt;/mxGraphModel&gt;&amp;#xa;  &lt;/diagram&gt;&lt;diagram id=\&quot;04-suggested-object-classification\&quot; name=\&quot;04 Suggested Object Classification\&quot;&gt;&amp;#xa;    &lt;mxGraphModel dx=\&quot;2400\&quot; dy=\&quot;1400\&quot; grid=\&quot;1\&quot; gridSize=\&quot;10\&quot; guides=\&quot;1\&quot; tooltips=\&quot;1\&quot; connect=\&quot;1\&quot; arrows=\&quot;1\&quot; fold=\&quot;1\&quot; page=\&quot;1\&quot; pageScale=\&quot;1\&quot; pageWidth=\&quot;4300\&quot; pageHeight=\&quot;2500\&quot; math=\&quot;0\&quot; shadow=\&quot;0\&quot;&gt;&amp;#xa;      &lt;root&gt;&amp;#xa;        &lt;mxCell id=\&quot;0\&quot;/&gt;&amp;#xa;        &lt;mxCell id=\&quot;1\&quot; parent=\&quot;0\&quot;/&gt;&amp;#xa;        &lt;mxCell id=\&quot;2\&quot; value=\&quot;&amp;lt;b&amp;gt;Suggested object classification v7&amp;lt;/b&amp;gt;\&quot; style=\&quot;text;html=1;strokeColor=none;fillColor=none;align=center;verticalAlign=middle;fontStyle=1;fontSize=24;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&amp;#xa;          &lt;mxGeometry x=\&quot;1300\&quot; y=\&quot;24\&quot; width=\&quot;1100\&quot; height=\&quot;36\&quot; as=\&quot;geometry\&quot;/&gt;&amp;#xa;        &lt;/mxCell&gt;&amp;#xa;        &lt;mxCell id=\&quot;3\&quot; value=\&quot;A critical classification pass so the object inventory can become a useful domain/internal model instead of a flat list.\&quot; style=\&quot;text;html=1;strokeColor=none;fillColor=none;align=left;verticalAlign=middle;fontSize=12;fontColor=#555555;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&amp;#xa;          &lt;mxGeometry x=\&quot;360\&quot; y=\&quot;66\&quot; width=\&quot;3300\&quot; height=\&quot;24\&quot; as=\&quot;geometry\&quot;/&gt;&amp;#xa;        &lt;/mxCell&gt;&amp;#xa;        &lt;mxCell id=\&quot;4\&quot; value=\&quot;&amp;lt;b&amp;gt;Likely domain entities&amp;lt;/b&amp;gt;&amp;lt;br/&amp;gt;&amp;lt;span style=&amp;quot;color:#555555&amp;quot;&amp;gt;Suggested first-pass classification&amp;lt;/span&amp;gt;&amp;lt;hr size=&amp;quot;1&amp;quot;/&amp;gt;• Idea&amp;lt;br/&amp;gt;• Opportunity&amp;lt;br/&amp;gt;• BusinessProblem&amp;lt;br/&amp;gt;• UserNeed&amp;lt;br/&amp;gt;• Analysis&amp;lt;br/&amp;gt;• ValidatedProblem&amp;lt;br/&amp;gt;• Stakeholder&amp;lt;br/&amp;gt;• Constraint&amp;lt;br/&amp;gt;• Recommendation&amp;lt;br/&amp;gt;• Blueprint&amp;lt;br/&amp;gt;• Feature&amp;lt;br/&amp;gt;• Requirement&amp;lt;br/&amp;gt;• Dependency&amp;lt;br/&amp;gt;• OpenQuestion&amp;lt;br/&amp;gt;• DevelopmentWork&amp;lt;br/&amp;gt;• WorkItem&amp;lt;br/&amp;gt;• TechnicalDecision&amp;lt;br/&amp;gt;• Defect&amp;lt;br/&amp;gt;• Release&amp;lt;br/&amp;gt;• ReleaseCandidate&amp;lt;br/&amp;gt;• Approval&amp;lt;br/&amp;gt;• Deployment&amp;lt;br/&amp;gt;• Incident\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#dae8fc;strokeColor=#6c8ebf;fontSize=12;align=left;verticalAlign=top;spacingTop=12;spacingLeft=14;spacingRight=14;spacingBottom=12;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&amp;#xa;          &lt;mxGeometry x=\&quot;180\&quot; y=\&quot;160\&quot; width=\&quot;880\&quot; height=\&quot;1260\&quot; as=\&quot;geometry\&quot;/&gt;&amp;#xa;        &lt;/mxCell&gt;&amp;#xa;        &lt;mxCell id=\&quot;5\&quot; value=\&quot;&amp;lt;b&amp;gt;Likely value objects / assessments&amp;lt;/b&amp;gt;&amp;lt;br/&amp;gt;&amp;lt;span style=&amp;quot;color:#555555&amp;quot;&amp;gt;Suggested first-pass classification&amp;lt;/span&amp;gt;&amp;lt;hr size=&amp;quot;1&amp;quot;/&amp;gt;• InitialValueHypothesis&amp;lt;br/&amp;gt;• Context&amp;lt;br/&amp;gt;• ImpactAssessment&amp;lt;br/&amp;gt;• FeasibilityAssessment&amp;lt;br/&amp;gt;• ProductOutcome&amp;lt;br/&amp;gt;• Scope&amp;lt;br/&amp;gt;• SuccessCriteria&amp;lt;br/&amp;gt;• DeliveryPath&amp;lt;br/&amp;gt;• Assumption&amp;lt;br/&amp;gt;• AcceptanceCriteria&amp;lt;br/&amp;gt;• QualityExpectation&amp;lt;br/&amp;gt;• ValidationResult&amp;lt;br/&amp;gt;• FitnessForPurposeAssessment&amp;lt;br/&amp;gt;• ReadinessDecision&amp;lt;br/&amp;gt;• RollbackDecision&amp;lt;br/&amp;gt;• DeploymentOutcome&amp;lt;br/&amp;gt;• PostDeploymentValidation\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#fff2cc;strokeColor=#d6b656;fontSize=12;align=left;verticalAlign=top;spacingTop=12;spacingLeft=14;spacingRight=14;spacingBottom=12;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&amp;#xa;          &lt;mxGeometry x=\&quot;1180\&quot; y=\&quot;160\&quot; width=\&quot;880\&quot; height=\&quot;1260\&quot; as=\&quot;geometry\&quot;/&gt;&amp;#xa;        &lt;/mxCell&gt;&amp;#xa;        &lt;mxCell id=\&quot;6\&quot; value=\&quot;&amp;lt;b&amp;gt;Likely internal records / artifacts&amp;lt;/b&amp;gt;&amp;lt;br/&amp;gt;&amp;lt;span style=&amp;quot;color:#555555&amp;quot;&amp;gt;Suggested first-pass classification&amp;lt;/span&amp;gt;&amp;lt;hr size=&amp;quot;1&amp;quot;/&amp;gt;• IdeaCaptureTask&amp;lt;br/&amp;gt;• IdeaEnrichment&amp;lt;br/&amp;gt;• IdeaScreeningDecision&amp;lt;br/&amp;gt;• AnalysisTask&amp;lt;br/&amp;gt;• ResearchArtifact&amp;lt;br/&amp;gt;• ConstraintRegister&amp;lt;br/&amp;gt;• BlueprintDocument&amp;lt;br/&amp;gt;• PlansMdFile&amp;lt;br/&amp;gt;• WorkDecomposition&amp;lt;br/&amp;gt;• AssumptionRegister&amp;lt;br/&amp;gt;• DecisionLog&amp;lt;br/&amp;gt;• BlueprintReview&amp;lt;br/&amp;gt;• DevelopmentTask&amp;lt;br/&amp;gt;• CodeChange&amp;lt;br/&amp;gt;• PullRequest&amp;lt;br/&amp;gt;• BuildRun&amp;lt;br/&amp;gt;• TestRun&amp;lt;br/&amp;gt;• DefectReport&amp;lt;br/&amp;gt;• TestEvidence&amp;lt;br/&amp;gt;• ReleaseChecklist&amp;lt;br/&amp;gt;• ReleaseNote&amp;lt;br/&amp;gt;• DeploymentRun&amp;lt;br/&amp;gt;• DeploymentStep&amp;lt;br/&amp;gt;• MonitoringSignal&amp;lt;br/&amp;gt;• DeploymentLog&amp;lt;br/&amp;gt;• RollbackRun\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#d5e8d4;strokeColor=#82b366;fontSize=12;align=left;verticalAlign=top;spacingTop=12;spacingLeft=14;spacingRight=14;spacingBottom=12;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&amp;#xa;          &lt;mxGeometry x=\&quot;2180\&quot; y=\&quot;160\&quot; width=\&quot;880\&quot; height=\&quot;1260\&quot; as=\&quot;geometry\&quot;/&gt;&amp;#xa;        &lt;/mxCell&gt;&amp;#xa;        &lt;mxCell id=\&quot;7\&quot; value=\&quot;&amp;lt;b&amp;gt;Likely governance / runtime objects&amp;lt;/b&amp;gt;&amp;lt;br/&amp;gt;&amp;lt;span style=&amp;quot;color:#555555&amp;quot;&amp;gt;Suggested first-pass classification&amp;lt;/span&amp;gt;&amp;lt;hr size=&amp;quot;1&amp;quot;/&amp;gt;• LifecycleRun&amp;lt;br/&amp;gt;• PhaseExecution&amp;lt;br/&amp;gt;• DraiverFunction&amp;lt;br/&amp;gt;• DraiverFunctionRun&amp;lt;br/&amp;gt;• HandoffGate&amp;lt;br/&amp;gt;• QualityGate&amp;lt;br/&amp;gt;• ReadinessGate&amp;lt;br/&amp;gt;• ReleaseApproval&amp;lt;br/&amp;gt;• HumanTestReview&amp;lt;br/&amp;gt;• TechnicalReview&amp;lt;br/&amp;gt;• PostDeploymentCheck&amp;lt;br/&amp;gt;• TraceabilityLink&amp;lt;br/&amp;gt;• FeedbackLoop&amp;lt;br/&amp;gt;• Actor\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#e1d5e7;strokeColor=#9673a6;fontSize=12;align=left;verticalAlign=top;spacingTop=12;spacingLeft=14;spacingRight=14;spa
