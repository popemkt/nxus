name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm agent:check

      - run: node scripts/check-app-registry.mjs
      - run: pnpm rules:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
        env:
          NX_DAEMON: 'false'

  spec-first:
    name: Spec-first gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: node scripts/check-spec-first.mjs "origin/${{ github.base_ref }}...HEAD"

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test:coverage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports
          path: |
            libs/*/coverage/
            apps/*/coverage/
          retention-days: 7

  e2e-tests:
    name: E2E Tests (${{ matrix.architecture }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        architecture: [node, graph]
    env:
      ARCHITECTURE_TYPE: ${{ matrix.architecture }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: npx playwright install --with-deps chromium

      # Graph leg runs against a SurrealDB SERVER, not the embedded engine:
      # surrealkv is single-process, and the six app dev-servers sharing one
      # embedded file corrupt it under concurrent access (invalid-revision
      # deserialization errors — learnings/surrealkv-multiprocess.md). Server
      # pinned to 3.x, matching the SDK (surrealdb ^2.0.4 + @surrealdb/node 3.x).
      - name: Start SurrealDB server (graph leg)
        if: matrix.architecture == 'graph'
        run: |
          curl -sSf https://install.surrealdb.com | sh -s -- --version v3.2.1
          "$HOME/.surrealdb/surreal" start --user root --pass root --bind 127.0.0.1:8790 memory &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8790/health && break
            sleep 1
          done
          echo "SURREAL_EMBEDDED=false" >> "$GITHUB_ENV"
          echo "SURREAL_URL=http://127.0.0.1:8790/rpc" >> "$GITHUB_ENV"

      - name: Seed database
        run: pnpm --filter @nxus/core-app db:seed

      - run: pnpm e2e
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results-${{ matrix.architecture }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
